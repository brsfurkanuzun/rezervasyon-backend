spring:
  application:
    name: randevu-backend

  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER:randevu}
    password: ${PGPASSWORD:randevu}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null


server:
  port: ${PORT:${SERVER_PORT:8080}}


management:
  endpoints:
    web:
      exposure:
        include: health,info


app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-very-long-secret-key-at-least-256-bits-long!!}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:3000,http://localhost:5174,http://127.0.0.1:5174}

  appointment:
    customer-cancellation-deadline-hours: 2

  apns:
    team-id: ${APNS_TEAM_ID:}
    key-id: ${APNS_KEY_ID:}
    private-key: ${APNS_PRIVATE_KEY:}
    partner:
      key-id: ${APNS_PARTNER_KEY_ID:}
      private-key: ${APNS_PARTNER_PRIVATE_KEY:}
    customer:
      key-id: ${APNS_CUSTOMER_KEY_ID:}
      private-key: ${APNS_CUSTOMER_PRIVATE_KEY:}
    customer-topic: ${APNS_CUSTOMER_TOPIC:com.rezplz.rezplz}
    partner-topic: ${APNS_PARTNER_TOPIC:com.rezplz.partner}


springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html


logging:
  level:
    com.randevupazaryeri: INFO


---
spring:
  config:
    activate:
      on-profile: dev

  autoconfigure:
    exclude: []

app:
  seed:
    enabled: true


---
spring:
  config:
    activate:
      on-profile: test

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration